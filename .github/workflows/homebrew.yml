name: Homebrew

# Bumps the casks in MC-Music-Workshop/homebrew-tap for a release:
#   - boomerang@beta tracks every release (alpha, beta, rc, stable)
#   - boomerang tracks stable releases only
# release.yml publishes releases with GITHUB_TOKEN, which doesn't fire
# `release: published`, so it dispatches this workflow after each release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (e.g. v2.6.0-alpha.3)"
        required: true

# Two releases published close together would otherwise race on the tap push.
concurrency:
  group: homebrew-tap

jobs:
  bump-casks:
    name: Bump Homebrew casks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping cask bump"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'
        with:
          repository: MC-Music-Workshop/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask versions and sha256
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags carry a "v" (v2.6.0-alpha.3); the pkg asset doesn't (Boomerang-2.6.0-alpha.3.pkg).
          VERSION="${TAG#v}"
          gh release download "$TAG" -R "${{ github.repository }}" \
            -p "Boomerang-${VERSION}.pkg" -O cask.pkg
          SHA256=$(sha256sum cask.pkg | cut -d' ' -f1)
          rm cask.pkg

          # Tag format is v{major}.{minor}.{patch}[-{prerelease}]; any "-" means prerelease.
          CASKS=("Casks/boomerang@beta.rb")
          if [[ "$TAG" != *-* ]]; then
            CASKS+=("Casks/boomerang.rb")
          fi

          sed -i -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            "${CASKS[@]}"
          git diff

          if git diff --quiet; then
            echo "Casks already at ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "boomerang ${VERSION}"
          git push
          echo "✓ Homebrew casks bumped to ${VERSION} (sha256 ${SHA256}): ${CASKS[*]}" >> "$GITHUB_STEP_SUMMARY"
