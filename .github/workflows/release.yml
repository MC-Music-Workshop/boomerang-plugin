name: Release

on:
  # Trigger on tag push - waits for the tag-triggered build of that commit
  push:
    tags: ['v*']
  # Manual trigger for re-releasing or releasing a specific tag
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0-beta-3)'
        required: true
        type: string

jobs:
  # Find the build for this tag's commit and wait for it to complete.
  # Tag pushes trigger their own Build run (which sees the tag, so artifacts
  # and the in-plugin version string carry the tag's version) - prefer that
  # run and block until it finishes.
  find-build:
    name: Find Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Wait for build of tagged commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Determine the tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Releasing tag: $TAG"

          # Resolve the tag to its commit (peels annotated tags)
          SHA=$(gh api "/repos/${GH_REPO}/commits/${TAG}" --jq '.sha')
          echo "Tag $TAG points to commit: $SHA"

          # Give the tag-triggered build a moment to register
          sleep 10

          # Prefer the run triggered by this tag push (its head_branch is the
          # tag name); fall back to the most recent run for the commit
          # (covers workflow_dispatch re-releases of an already-built tag).
          RUN_ID=$(gh api "/repos/${GH_REPO}/actions/workflows/build.yml/runs?head_sha=${SHA}&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_branch == \"${TAG}\")][0].id // .workflow_runs[0].id // empty")

          if [ -z "$RUN_ID" ]; then
            echo "::error::No build run found for commit ${SHA}. Is the commit pushed?"
            exit 1
          fi

          # Block until the run completes; exits non-zero if it fails
          echo "Waiting for build run $RUN_ID..."
          gh run watch "$RUN_ID" --exit-status

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Build run [$RUN_ID](https://github.com/${GH_REPO}/actions/runs/${RUN_ID}) completed successfully" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: find-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS artifacts
        uses: actions/download-artifact@v6
        with:
          name: turrama-macos
          path: artifacts/turrama-macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-build.outputs.run_id }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: turrama-windows
          path: artifacts/turrama-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-build.outputs.run_id }}

      - name: Download Linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: turrama-linux
          path: artifacts/turrama-linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-build.outputs.run_id }}

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create "latest" artifacts for Gumroad
        run: |
          mkdir -p dist
          
          # Find and copy each platform's zip/tarball with "latest" name for stable Gumroad URL
          MACOS_ZIP=$(find artifacts/turrama-macos -name "*.zip" | head -1)
          if [ -n "$MACOS_ZIP" ]; then
            cp "$MACOS_ZIP" dist/Turrama-latest-macOS.zip
            echo "✓ Created: Turrama-latest-macOS.zip" >> $GITHUB_STEP_SUMMARY
          fi
          
          WINDOWS_ZIP=$(find artifacts/turrama-windows -name "*.zip" | head -1)
          if [ -n "$WINDOWS_ZIP" ]; then
            cp "$WINDOWS_ZIP" dist/Turrama-latest-Windows.zip
            echo "✓ Created: Turrama-latest-Windows.zip" >> $GITHUB_STEP_SUMMARY
          fi
          
          LINUX_TAR=$(find artifacts/turrama-linux -name "*.tar.gz" | head -1)
          if [ -n "$LINUX_TAR" ]; then
            cp "$LINUX_TAR" dist/Turrama-latest-Linux.tar.gz
            echo "✓ Created: Turrama-latest-Linux.tar.gz" >> $GITHUB_STEP_SUMMARY
            
            # Copy GPG signature if present
            LINUX_SIG="${LINUX_TAR}.asc"
            if [ -f "$LINUX_SIG" ]; then
              cp "$LINUX_SIG" dist/Turrama-latest-Linux.tar.gz.asc
              echo "✓ Created: Turrama-latest-Linux.tar.gz.asc (GPG signature)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Copy macOS installer with "latest" name
          MACOS_PKG=$(find artifacts/turrama-macos -name "*.pkg" | head -1)
          if [ -n "$MACOS_PKG" ]; then
            cp "$MACOS_PKG" dist/Turrama-latest-macOS.pkg
            echo "✓ Created: Turrama-latest-macOS.pkg" >> $GITHUB_STEP_SUMMARY
          fi
          
          {
            echo ""
            echo "**Stable Gumroad URLs:**"
            echo "\`\`\`"
            echo "https://github.com/MC-Music-Workshop/boomerang-plugin/releases/latest/download/Turrama-latest-macOS.zip"
            echo "https://github.com/MC-Music-Workshop/boomerang-plugin/releases/latest/download/Turrama-latest-macOS.pkg"
            echo "https://github.com/MC-Music-Workshop/boomerang-plugin/releases/latest/download/Turrama-latest-Windows.zip"
            echo "https://github.com/MC-Music-Workshop/boomerang-plugin/releases/latest/download/Turrama-latest-Linux.tar.gz"
            echo "https://github.com/MC-Music-Workshop/boomerang-plugin/releases/latest/download/Turrama-latest-Linux.tar.gz.asc"
            echo "\`\`\`" 
          } >> $GITHUB_STEP_SUMMARY
          
          ls -la dist/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.find-build.outputs.tag }}
          make_latest: true
          files: |
            artifacts/turrama-macos/*
            artifacts/turrama-windows/*
            artifacts/turrama-linux/*
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Show In Summary
        env:
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
          RELEASE_TAG: ${{ needs.find-build.outputs.tag }}
        run: |
          {
            echo "## Release Created"
            echo ""
            echo "- Release tag: $RELEASE_TAG"
            echo "- [Release Link]($RELEASE_URL)"
          } >> $GITHUB_STEP_SUMMARY

